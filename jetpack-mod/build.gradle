plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.jetpack'

base { archivesName = 'jetpack' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Bump to the latest 21.1.x if you like
    version = '21.1.172'

    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }

    mods {
        jetpack { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
